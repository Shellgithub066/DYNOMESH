# GitHub → Render Blueprint (repo root = this project)
services:
  - type: web
    name: dynomesh-2026
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
